name: FCP-11 Control Plane CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "scripts/ai/fabric_control_plane_*.py"
      - "scripts/tests/test_fabric_control_plane_*.py"
      - "frontend/views/fabric_control_plane_view.py"
      - "frontend/layouts/sidebar.py"
      - "app/main.py"
      - ".github/workflows/fcp11-control-plane.yml"

permissions:
  contents: read

jobs:
  fcp11-control-plane:
    name: FCP-11 control plane / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FCP-11 compile without Flet installed
        run: |
          python -m py_compile scripts/ai/fabric_control_plane_contract.py scripts/ai/fabric_control_plane_snapshot.py scripts/ai/fabric_control_plane_evidence.py scripts/ai/fabric_control_plane_history.py scripts/ai/fabric_control_plane_resources.py scripts/ai/fabric_control_plane_attention.py scripts/ai/fabric_control_plane_gateway.py scripts/ai/fabric_control_plane_cli.py frontend/views/fabric_control_plane_view.py frontend/layouts/sidebar.py app/main.py
- name: FCP-11A..H control plane, gateway, CLI, Flet view and integration regression without skipped tests
  run: |
          python -c "import sys,unittest; ns=tuple('scripts.tests.test_fabric_control_plane_'+n for n in ('contract','snapshot','evidence','history','resources','attention','gateway','cli','view','integration')); m=(40,50,50,40,25,30,30,15,20,12); ss=[unittest.defaultTestLoader.loadTestsFromName(n) for n in ns]; c=[x.countTestCases() for x in ss]; r=unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(ss)); print('FCP11_CONTROL_PLANE_TESTS_RUN=',c,'TOTAL=',sum(c),'SKIPPED=',len(r.skipped),'EXPECTED_FAILURES=',len(r.expectedFailures),'UNEXPECTED_SUCCESSES=',len(r.unexpectedSuccesses)); sys.exit(0 if r.wasSuccessful() and r.testsRun == sum(c) and sum(c) >= 300 and len(c) == len(m) and all(x >= y for x, y in zip(c, m)) and not r.skipped and not r.expectedFailures and not r.unexpectedSuccesses else 2)"
