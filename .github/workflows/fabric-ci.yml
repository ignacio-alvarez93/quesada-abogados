  fcp3b2a-pr-gate:
    name: FCP-3B-2A PR eligibility gate / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FCP-3B-2A PR eligibility gate regression
        run: |
          python -m unittest scripts.tests.test_runner_promotion_pr_gate -q

  fcp3b2b1-human-authorization:
    name: FCP-3B-2B1 human decision evidence / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FCP-3B-2B1 human decision evidence regression
        run: |
          python -m unittest scripts.tests.test_runner_promotion_human_authorization -q

  fcp3b2b2-governed-executor:
    name: FCP-3B-2B2 governed executor simulation / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FCP-3B-2B2 governed executor simulation regression
        run: |
          python -m unittest scripts.tests.test_runner_promotion_executor -q

  fcp4d02-worktree-retirement:
    name: FCP-4C/4D worktree inventory and retirement assessment / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python --version
          git --version
      - name: FCP-4C/4D worktree inventory, retirement assessment and governed Git reads without skipped tests
        run: |
          python -c "import sys,unittest; ns=('scripts.tests.test_runner_worktree_inventory','scripts.tests.test_runner_worktree_retirement','scripts.tests.test_runner_integration','scripts.tests.test_runner_worktree_retirement_authorization'); suite=unittest.defaultTestLoader.loadTestsFromNames(ns); result=unittest.TextTestRunner(verbosity=1).run(suite); print('WORKTREE_TESTS_SKIPPED=',len(result.skipped)); sys.exit(0 if result.wasSuccessful() and not result.skipped else 2)"

  fcp3b2b2-host-trust:
    name: FCP-3B-2B2 HOST-01 trust adapters / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned cryptography for Ed25519
        run: |
          python -m pip install "cryptography==50.0.2"
      - name: Verify Ed25519 dependency available
        run: |
          python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey; from scripts.ai.runner_promotion_host_authority import CRYPTO_AVAILABLE; assert CRYPTO_AVAILABLE"
          python -c "from scripts.ai.runner_worktree_retirement_host_authority import CRYPTO_AVAILABLE as R; assert R"
      - name: FCP-3B-2B2 HOST-01 security regression without skipped tests
        run: |
          python -c "import sys,unittest; ns=('scripts.tests.test_runner_promotion_host_authority','scripts.tests.test_runner_promotion_host_ledger','scripts.tests.test_runner_promotion_host_github','scripts.tests.test_runner_worktree_retirement_host_authority'); suite=unittest.defaultTestLoader.loadTestsFromNames(ns); result=unittest.TextTestRunner(verbosity=1).run(suite); print('HOST_TESTS_SKIPPED=',len(result.skipped)); sys.exit(0 if result.wasSuccessful() and not result.skipped else 2)"
      - name: FCP-4E-02c retirement host ledger regression without skipped tests
        run: |
          python -c "import sys,unittest; ns=('scripts.tests.test_runner_worktree_retirement_host_ledger',); suite=unittest.defaultTestLoader.loadTestsFromNames(ns); result=unittest.TextTestRunner(verbosity=1).run(suite); print('RETIREMENT_LEDGER_TESTS_SKIPPED=',len(result.skipped)); sys.exit(0 if result.wasSuccessful() and not result.skipped else 2)"
      - name: FCP-4F-01 retirement executor simulation regression without skipped tests
        run: |
          python -c "import sys,unittest; s=unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_runner_worktree_retirement_executor_simulation'); r=unittest.TextTestRunner(verbosity=1).run(s); print('RETIREMENT_SIMULATION_TESTS_SKIPPED=',len(r.skipped)); sys.exit(0 if r.wasSuccessful() and not r.skipped else 2)"
      - name: FCP-4F-02 retirement readiness matrix regression without skipped tests
        run: |
          python -c "import sys,unittest; s=unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_runner_worktree_retirement_readiness_simulation'); r=unittest.TextTestRunner(verbosity=1).run(s); print('RETIREMENT_READINESS_TESTS_SKIPPED=',len(r.skipped)); sys.exit(0 if r.wasSuccessful() and not r.skipped else 2)"
      - name: FCP-4E-02d retirement evidence composition regression without skipped tests
        run: |
          python -c "import sys,unittest; s=unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_runner_worktree_retirement_host_composition'); r=unittest.TextTestRunner(verbosity=1).run(s); print('RETIREMENT_COMPOSITION_TESTS_SKIPPED=',len(r.skipped)); sys.exit(0 if r.wasSuccessful() and not r.skipped else 2)"
