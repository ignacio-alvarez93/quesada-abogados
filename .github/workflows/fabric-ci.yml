name: Fabric CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "scripts/ai/**"
      - "scripts/tests/**"
      - ".github/workflows/fabric-ci.yml"
  push:
    branches:
      - "feature/fabric-ci-validation-v1"
      - "feature/fabric-integration-audit-v1"

permissions:
  contents: read

jobs:
  fabric-regression:
    name: Fabric regression / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 35

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Environment
        run: |
          python --version
          git --version
          python -m compileall -q scripts/ai

      - name: FCP-7A-01 provider routing pure policy regression without skipped tests
        run: |
          python -c "import sys,unittest; s=unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_fabric_provider_routing_policy'); r=unittest.TextTestRunner(verbosity=1).run(s); print('PROVIDER_ROUTING_POLICY_TESTS_RUN=',r.testsRun,'SKIPPED=',len(r.skipped),'EXPECTED_FAILURES=',len(r.expectedFailures)); sys.exit(0 if r.wasSuccessful() and r.testsRun >= 45 and not r.skipped and not r.expectedFailures and not r.unexpectedSuccesses else 2)"

      - name: FCP-6B-01 recovery advisory read-only regression without skipped tests
        run: |
          python -c "import sys,unittest; s=unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_runner_recovery_advisory'); r=unittest.TextTestRunner(verbosity=1).run(s); print('RECOVERY_ADVISORY_TESTS_RUN=',r.testsRun,'SKIPPED=',len(r.skipped)); sys.exit(0 if r.wasSuccessful() and r.testsRun >= 35 and not r.skipped else 2)"

      - name: FCP-6A-01 failure intelligence read-only regression without skipped tests
        run: |
          python -c "import sys,unittest; s=unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_runner_failure_intelligence'); r=unittest.TextTestRunner(verbosity=1).run(s); print('FAILURE_INTELLIGENCE_TESTS_RUN=',r.testsRun,'SKIPPED=',len(r.skipped)); sys.exit(0 if r.wasSuccessful() and r.testsRun >= 30 and not r.skipped else 2)"

      - name: FCP-6C-01..04 nightshift composed regression without skipped tests
        run: |
          python -c "import sys,unittest; ns=('scripts.tests.test_fcp6c01_director_recovery_view', 'scripts.tests.test_fcp6c02_recovery_report_cli', 'scripts.tests.test_fcp6c03_failure_advisory_invariants', 'scripts.tests.test_fcp6c04_runner_authority_guards'); s=unittest.defaultTestLoader.loadTestsFromNames(ns); r=unittest.TextTestRunner(verbosity=1).run(s); print('FCP6C_NIGHTSHIFT_CI_TESTS_RUN=',r.testsRun,'SKIPPED=',len(r.skipped),'EXPECTED_FAILURES=',len(r.expectedFailures)); sys.exit(0 if r.wasSuccessful() and r.testsRun >= 122 and not r.skipped and not r.expectedFailures and not r.unexpectedSuccesses else 2)"

      - name: Director and CLI regression
        run: |
          python -m unittest scripts.tests.test_fabric_director scripts.tests.test_fabric_director_cli -q

      - name: Governed Git security regression
        run: |
          python -m unittest scripts.tests.test_runner_git -q

      - name: Pipeline and infrastructure regression
        run: |
          python -m unittest scripts.tests.test_runner_pipeline scripts.tests.test_runner_providers scripts.tests.test_runner_factory_ledger scripts.tests.test_runner_module_governance -q

      - name: FCP-5A-01 DAG blueprint bridge regression without skipped tests
        run: |
          python -c "import sys,unittest; s=unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_fabric_dag_blueprint'); r=unittest.TextTestRunner(verbosity=1).run(s); print('DAG_BLUEPRINT_TESTS_SKIPPED=',len(r.skipped)); sys.exit(0 if r.wasSuccessful() and not r.skipped else 2)"

      - name: Runner Queue Multiworker regression
        run: |
          python -m unittest scripts.tests.test_claude_runner scripts.tests.test_claude_queue scripts.tests.test_claude_multiworker scripts.tests.test_runner_process_supervision scripts.tests.test_runner_provider_quota_guard -q

      - name: FCP-5B-01 Director DAG gateway regression without skipped tests
        run: |
          python -c "import sys,unittest; s=unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_fabric_director_dag'); r=unittest.TextTestRunner(verbosity=1).run(s); print('DIRECTOR_DAG_TESTS_RUN=',r.testsRun,'SKIPPED=',len(r.skipped)); sys.exit(0 if r.wasSuccessful() and r.testsRun and not r.skipped else 2)"

  fcp2b-reconciliation:
    name: FCP-2B reconciliation / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FCP-2B reconciliation regression
        run: |
          python -m unittest scripts.tests.test_runner_reconciliation -q

  fcp3a-promotion:
